<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>볼링팀 회비 및 지출 정산</title>
  <meta name="description" content="월 회비와 회식·이벤트 경기 지출을 함께 관리하는 볼링팀 정산표">
  <style>
    :root{--navy:#173f5f;--blue:#2a6f97;--teal:#2f7d6a;--line:#d8e2e8;--ink:#1e3444;--red:#b4533c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#edf4f7,#f8fafb 45%,#eef5f2);color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}button,input,select{font:inherit}.shell{min-height:100vh;padding:36px clamp(14px,4vw,60px)}.hero,.summary,.card,.save-state{max-width:1600px;margin-left:auto;margin-right:auto}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.eyebrow{margin:0 0 7px;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.14em}h1{margin:0;color:var(--navy);font-size:clamp(27px,3vw,42px);letter-spacing:-.04em}.sub{margin:9px 0 0;color:#687e89}.reset{border:1px solid #c8d7df;background:#fff;color:#506875;border-radius:10px;padding:10px 15px;cursor:pointer}.summary{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:12px;margin-bottom:20px}.stat{min-height:90px;padding:18px 21px;background:#fff;border:1px solid #dbe5ea;border-radius:14px;box-shadow:0 6px 18px #20465b0d;display:flex;flex-direction:column;justify-content:center}.stat span{color:#718590;font-size:13px;font-weight:700}.stat strong{color:var(--navy);font-size:25px;margin-top:5px}.stat.main{background:var(--navy);border-color:var(--navy)}.stat.main span{color:#bdd4e2}.stat.main strong{color:#fff;font-size:30px}.stat.out strong{color:var(--red)}.card{background:#fff;border:1px solid #dbe5ea;border-radius:16px;box-shadow:0 18px 45px #22415214;overflow:hidden;margin-bottom:22px}.card-head{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:18px;border-bottom:1px solid var(--line)}.card-head h2{margin:0;color:var(--navy);font-size:19px}.card-head p{margin:5px 0 0;color:#71858f;font-size:13px}.legend{white-space:nowrap;color:#657a85;font-size:13px}.legend i{display:inline-grid;place-items:center;width:20px;height:20px;background:var(--teal);border-radius:5px;color:#fff;font-style:normal;font-weight:900}.scroll{overflow:auto}table{width:100%;min-width:1180px;border-collapse:separate;border-spacing:0}th,td{height:50px;padding:6px 8px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}thead th{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;font-size:13px}.name{min-width:140px;background:#fff8dc;text-align:left}.name input{width:100%;border:0;background:transparent;padding:8px;outline:0;border-radius:7px}.name input:focus{background:#fff;box-shadow:0 0 0 2px #80b7d2}.check-cell{background:#fffcf1}.check{width:29px;height:29px;border:2px solid #9aabb4;border-radius:7px;background:#fff;color:#fff;cursor:pointer;font-size:19px;font-weight:900;line-height:1}.check.on{background:var(--teal);border-color:var(--teal)}.money{text-align:right;white-space:nowrap;font-size:13px;font-variant-numeric:tabular-nums}.annual{background:#eef8f4;color:#24604f;font-weight:800}tfoot th,tfoot td{position:sticky;bottom:0;background:var(--teal);color:#fff;font-weight:800;border-color:#246454}.form{display:grid;grid-template-columns:160px 165px minmax(220px,1fr) 170px auto;gap:12px;padding:18px 22px;background:#f7fafb;border-bottom:1px solid var(--line);align-items:end}.form label{display:flex;flex-direction:column;gap:6px}.form label span{font-size:12px;color:#667c88;font-weight:700}.form input,.form select{height:42px;border:1px solid #cbd9e0;border-radius:8px;background:#fff;padding:0 11px;color:#263c49;outline:0}.form input:focus,.form select:focus{border-color:#5f9fbd;box-shadow:0 0 0 3px #d9edf5}.date-hint{font-size:11px;color:#82949d;font-weight:400}.add{height:42px;border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:800;padding:0 18px;cursor:pointer}.expenses{padding:0 22px}.expense{min-height:58px;display:grid;grid-template-columns:110px 110px 1fr 140px 50px;gap:12px;align-items:center;border-bottom:1px solid #e7edf0;font-size:14px}.expense time{color:#6b7f89}.pill{justify-self:start;background:#e9f2f6;color:#346883;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}.amount{color:var(--red);font-weight:800;text-align:right;white-space:nowrap}.delete{border:0;background:transparent;color:#899aa3;cursor:pointer}.empty{padding:30px;text-align:center;color:#8b9ba3}.save-state{text-align:right;color:#748790;font-size:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e0a038;margin-right:6px}.dot.online{background:#4ea07f}.error{color:#b84534}.hidden{display:none!important}@media(max-width:1000px){.form{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.expense{grid-template-columns:100px 100px 1fr 125px 45px}}@media(max-width:760px){.shell{padding:22px 11px}.hero{align-items:start}.summary{grid-template-columns:1fr 1fr}.stat.main{grid-column:1/-1}.card-head{align-items:start}.expense{grid-template-columns:90px 1fr 105px 40px}.expense strong{grid-column:2/4}.expense .delete{grid-column:4;grid-row:1/3}}@media(max-width:520px){.hero{display:block}.reset{margin-top:14px}.form{grid-template-columns:1fr}.wide{grid-column:auto}.card-head{display:block}.legend{margin-top:10px}.expense{grid-template-columns:1fr auto;padding:12px 0;gap:6px}.expense>*{grid-column:auto!important;grid-row:auto!important}.expense strong{grid-column:1/-1!important}}
  </style>
  <style>.member-control{display:flex;align-items:center;gap:7px;margin-top:6px}.member-control button{width:31px;height:31px;border:1px solid #c7d6de;border-radius:8px;background:#f7fafb;color:var(--navy);font-size:20px;line-height:1;cursor:pointer}.member-control button:hover{background:#e9f2f6}.member-control input{width:58px;height:31px;border:1px solid #c7d6de;border-radius:8px;text-align:center;color:var(--navy);font-weight:800;outline:0}.member-control input:focus{border-color:#5f9fbd;box-shadow:0 0 0 3px #d9edf5}.member-control em{font-style:normal;color:#718590;font-size:13px}.hero-actions{display:flex;gap:8px;align-items:center}.admin-button{border:1px solid #85a6b7;background:#eaf3f7;color:var(--navy);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:800;white-space:nowrap}.admin-button.unlocked{background:#e5f4ed;border-color:#86bba6;color:#24604f}@media(max-width:520px){.hero-actions{margin-top:14px}.reset{margin-top:0}}</style>
</head>
<body>
<main class="shell">
  <section class="hero"><div><p class="eyebrow">BOWLING TEAM · FIREBASE SYNC</p><h1>볼링팀 회비 및 지출 정산</h1><p class="sub">월 회비와 회식·이벤트 경기 지출을 실시간으로 함께 관리하세요.</p></div><div class="hero-actions"><button class="admin-button" id="adminLockBtn">🔒 관리자 잠금</button><button class="reset" id="resetBtn">전체 초기화</button></div></section>
  <section class="summary"><article class="stat main"><span>현재 잔액</span><strong id="balance">0원</strong></article><article class="stat"><span>총 회비 수입</span><strong id="income">0원</strong></article><article class="stat out"><span>총 지출</span><strong id="outgo">0원</strong></article><article class="stat"><span>등록 회원</span><div class="member-control"><button id="memberMinus" type="button" aria-label="회원 한 명 줄이기">−</button><input id="memberCount" type="number" min="1" max="50" value="15" aria-label="회원 수"><button id="memberPlus" type="button" aria-label="회원 한 명 늘리기">+</button><em>명</em></div></article></section>
  <section class="card"><div class="card-head"><div><h2>월별 회비 납부 현황</h2><p>네모 칸을 클릭하면 10,000원이 반영됩니다.</p></div><div class="legend"><i>✓</i> 납부 완료</div></div><div class="scroll"><table id="feeTable"></table></div></section>
  <section class="card"><div class="card-head"><div><p class="eyebrow">EXPENSE SETTLEMENT</p><h2>회식·이벤트 경기 지출 정산</h2><p>지출을 추가하면 현재 잔액에서 자동 차감됩니다.</p></div><strong class="amount" id="expenseTitle">지출 합계 0원</strong></div>
    <form class="form" id="expenseForm"><label><span>날짜 <small class="date-hint">직접 입력: YYYY-MM-DD</small></span><input id="date" type="text" inputmode="numeric" maxlength="10" placeholder="2026-08-24" autocomplete="off" required></label><label><span>구분</span><select id="category"><option>회식</option><option>이벤트 경기</option><option>대회 참가</option><option>장비·용품</option><option>기타</option></select></label><label class="wide"><span>내용</span><input id="description" placeholder="예: 8월 정기 회식" required></label><label><span>금액</span><input id="amount" inputmode="numeric" placeholder="0" required></label><button class="add">지출 추가</button></form><div class="expenses" id="expenseList"></div>
  </section>
  <p class="save-state" id="saveState"><span class="dot"></span><span>Firebase 연결 중...</span></p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCLUNqnDrXLMkZHyxWfbM1Zfbimdk3AKWw",authDomain:"ma-db-d0c98.firebaseapp.com",projectId:"ma-db-d0c98",storageBucket:"ma-db-d0c98.firebasestorage.app",messagingSenderId:"497220756438",appId:"1:497220756438:web:72610748c39c6e29eb3a77"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const docRef=db.collection("bowlingTeamFee").doc("main");
const MONTHS=Array.from({length:12},(_,i)=>`${i+1}월`),FEE=10000;let state={members:Array.from({length:15},(_,i)=>({name:`회원${i+1}`,paid:Array(12).fill(false)})),expenses:[],adminPinHash:""};let loaded=false,saveTimer,adminUnlocked=sessionStorage.getItem("bowlingAdminUnlocked")==="1";
const $=id=>document.getElementById(id),won=n=>`${Number(n||0).toLocaleString("ko-KR")}원`,today=()=>new Date().toISOString().slice(0,10),validDate=v=>/^\d{4}-(0[1-9]|1[0-2])-([0-2]\d|3[01])$/.test(v);
function setStatus(text,ok=false,error=false){$("saveState").innerHTML=`<span class="dot ${ok?"online":""}"></span><span class="${error?"error":""}">${text}</span>`}
function totals(){const monthly=MONTHS.map((_,m)=>state.members.filter(x=>x.paid[m]).length*FEE),income=monthly.reduce((a,b)=>a+b,0),outgo=state.expenses.reduce((a,b)=>a+Number(b.amount||0),0);return{monthly,income,outgo,balance:income-outgo}}
function render(){const t=totals();$("balance").textContent=won(t.balance);$("income").textContent=won(t.income);$("outgo").textContent=won(t.outgo);$("expenseTitle").textContent=`지출 합계 ${won(t.outgo)}`;$("memberCount").value=state.members.length;$("adminLockBtn").textContent=adminUnlocked?"🔓 관리자 수정 중":"🔒 관리자 잠금";$("adminLockBtn").classList.toggle("unlocked",adminUnlocked);
  $("feeTable").innerHTML=`<thead><tr><th>회원명</th>${MONTHS.map(m=>`<th>${m}</th>`).join("")}<th>연간 합계</th></tr></thead><tbody>${state.members.map((member,i)=>`<tr><td class="name"><input data-name="${i}" value="${escapeHtml(member.name)}" aria-label="${i+1}번 회원 이름"></td>${member.paid.map((paid,m)=>`<td class="check-cell"><button class="check ${paid?"on":""}" data-check="${i},${m}" aria-pressed="${paid}">${paid?"✓":""}</button></td>`).join("")}<td class="money annual">${won(member.paid.filter(Boolean).length*FEE)}</td></tr>`).join("")}</tbody><tfoot><tr><th>월별 합계</th>${t.monthly.map(v=>`<td class="money">${won(v)}</td>`).join("")}<td class="money">${won(t.income)}</td></tr></tfoot>`;
  $("expenseList").innerHTML=state.expenses.length?state.expenses.map(x=>`<article class="expense"><time>${escapeHtml(x.date)}</time><span class="pill">${escapeHtml(x.category)}</span><strong>${escapeHtml(x.description)}</strong><span class="amount">− ${won(x.amount)}</span><button class="delete" data-delete="${x.id}">삭제</button></article>`).join(""):`<div class="empty">아직 등록된 지출 내역이 없습니다.</div>`;
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function hashPin(pin){const bytes=new TextEncoder().encode(pin);const hash=await crypto.subtle.digest("SHA-256",bytes);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("")}
async function ensureAdmin(){if(adminUnlocked)return true;if(!state.adminPinHash){const pin=prompt("최초 관리자 비밀번호를 설정하세요. (6자리 이상)");if(pin===null)return false;if(pin.length<6){alert("비밀번호는 6자리 이상으로 설정해 주세요.");return false}const again=prompt("관리자 비밀번호를 한 번 더 입력하세요.");if(pin!==again){alert("비밀번호가 일치하지 않습니다.");return false}state.adminPinHash=await hashPin(pin);adminUnlocked=true;sessionStorage.setItem("bowlingAdminUnlocked","1");render();save();alert("관리자 비밀번호가 설정되었습니다.");return true}const pin=prompt("수정하려면 관리자 비밀번호를 입력하세요.");if(pin===null)return false;if(await hashPin(pin)!==state.adminPinHash){alert("비밀번호가 올바르지 않습니다.");return false}adminUnlocked=true;sessionStorage.setItem("bowlingAdminUnlocked","1");render();return true}
function save(){if(!loaded)return;clearTimeout(saveTimer);setStatus("저장 중...");saveTimer=setTimeout(()=>docRef.set({...state,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>setStatus("Firebase에 자동 저장됨",true)).catch(e=>setStatus("저장 실패: Firebase 권한을 확인하세요",false,true)),350)}
$("feeTable").addEventListener("click",async e=>{const b=e.target.closest("[data-check]");if(!b||!await ensureAdmin())return;const[i,m]=b.dataset.check.split(",").map(Number);state.members[i].paid[m]=!state.members[i].paid[m];render();save()});
$("feeTable").addEventListener("focusin",async e=>{if(e.target.dataset.name===undefined||await ensureAdmin())return;e.target.blur();render()});$("feeTable").addEventListener("input",e=>{if(e.target.dataset.name===undefined||!adminUnlocked){render();return}state.members[Number(e.target.dataset.name)].name=e.target.value;save()});
$("date").value=today();$("date").addEventListener("input",e=>{let v=e.target.value.replace(/[^0-9]/g,"").slice(0,8);e.target.value=v.length>4?v.slice(0,4)+"-"+v.slice(4,6)+(v.length>6?"-"+v.slice(6):""):v});$("amount").addEventListener("input",e=>e.target.value=e.target.value.replace(/[^0-9]/g,""));
$("expenseForm").addEventListener("submit",async e=>{e.preventDefault();if(!await ensureAdmin())return;const date=$("date").value,description=$("description").value.trim(),amount=Number($("amount").value);if(!validDate(date)){alert("날짜를 YYYY-MM-DD 형식으로 입력해 주세요.");$("date").focus();return}if(!description||amount<=0)return;state.expenses.unshift({id:Date.now(),date,category:$("category").value,description,amount});$("description").value="";$("amount").value="";render();save()});
$("expenseList").addEventListener("click",async e=>{const b=e.target.closest("[data-delete]");if(!b||!await ensureAdmin())return;state.expenses=state.expenses.filter(x=>String(x.id)!==b.dataset.delete);render();save()});
async function resizeMembers(requested){if(!await ensureAdmin()){render();return}const count=Math.max(1,Math.min(50,Number(requested)||1)),current=state.members.length;if(count===current)return;if(count<current&&!confirm(`회원 수를 ${count}명으로 줄이면 마지막 ${current-count}명의 이름과 납부 기록이 삭제됩니다. 계속할까요?`)){render();return}if(count>current){for(let i=current;i<count;i++)state.members.push({name:`회원${i+1}`,paid:Array(12).fill(false)})}else state.members=state.members.slice(0,count);render();save()}
$("memberMinus").addEventListener("click",()=>resizeMembers(state.members.length-1));$("memberPlus").addEventListener("click",()=>resizeMembers(state.members.length+1));$("memberCount").addEventListener("change",e=>resizeMembers(e.target.value));
$("adminLockBtn").addEventListener("click",async()=>{if(adminUnlocked){adminUnlocked=false;sessionStorage.removeItem("bowlingAdminUnlocked");render()}else await ensureAdmin()});
$("resetBtn").addEventListener("click",async()=>{if(!await ensureAdmin()||!confirm("회원명, 납부 체크, 지출 내역을 모두 초기화할까요?"))return;state={members:Array.from({length:15},(_,i)=>({name:`회원${i+1}`,paid:Array(12).fill(false)})),expenses:[],adminPinHash:state.adminPinHash};render();save()});
docRef.onSnapshot(snap=>{if(snap.exists){const data=snap.data();state={members:Array.isArray(data.members)?data.members:state.members,expenses:Array.isArray(data.expenses)?data.expenses:[],adminPinHash:data.adminPinHash||""}}loaded=true;render();setStatus("Firebase 실시간 연결됨",true);if(!snap.exists)save()},()=>{loaded=true;render();setStatus("Firebase 연결 실패 — 설정과 권한을 확인하세요",false,true)});
render();
</script>
</body></html>
